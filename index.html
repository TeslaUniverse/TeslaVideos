<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Videos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    display:flex;
    height:100vh;
}

.sidebar{
    width:320px;
    background:#1f2937;
    overflow-y:auto;
    border-right:1px solid #374151;
}

.logo{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#ef4444;
}

.search{
    padding:15px;
}

.search input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
}

.categories{
    padding:15px;
}

.category{
    background:#374151;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    cursor:pointer;
}

.category:hover{
    background:#4b5563;
}

.button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ef4444;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.video-list{
    padding:15px;
}

.video-card{
    background:#1f2937;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:12px;
    cursor:pointer;
}

.video-card img{
    width:100%;
    display:block;
}

.video-title{
    padding:10px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    border-bottom:1px solid #374151;
}

.player{
    flex:1;
    padding:20px;
}

.player iframe{
    width:100%;
    height:80vh;
    border:none;
    border-radius:12px;
    background:black;
}
</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
TESLA VIDEOS
</div>

<div class="search">
<input
type="text"
id="search"
placeholder="Søg video..."
oninput="renderVideos()">
</div>

<div class="categories" id="categories"></div>

<div style="padding:15px;">
<button class="button" onclick="addCategory()">
➕ Ny kategori
</button>
</div>

<div class="video-list" id="videos"></div>

</div>

<div class="main">

<div class="header">
<h2 id="currentTitle">
Vælg en video
</h2>
</div>

<div class="player">
<iframe
id="player"
allowfullscreen>
</iframe>
</div>

</div>

<script>

let library =
JSON.parse(localStorage.getItem('teslaVideos')) ||
{
    Afghani: [],
    Bollywood: []
};

let currentCategory = 'Afghani';

function saveLibrary() {
    localStorage.setItem(
        'teslaVideos',
        JSON.stringify(library)
    );
}

function renderCategories(){

    const container =
    document.getElementById('categories');

    container.innerHTML = '';

    Object.keys(library).forEach(category => {

        const item =
        document.createElement('div');

        item.className = 'category';

        item.textContent = '📁 ' + category;

        item.onclick = () => {

            currentCategory = category;

            renderVideos();

        };

        container.appendChild(item);

    });

}

function renderVideos(){

    const container =
    document.getElementById('videos');

    const search =
    document.getElementById('search')
    .value
    .toLowerCase();

    container.innerHTML = '';

    library[currentCategory]
    .filter(video =>
        video.title
        .toLowerCase()
        .includes(search)
    )
    .forEach(video => {

        const thumbnail =
        'https://img.youtube.com/vi/' +
        video.youtubeId +
        '/hqdefault.jpg';

        const card =
        document.createElement('div');

        card.className =
        'video-card';

        card.innerHTML = `
            ${thumbnail}
            <div class="video-title">
                ${video.title}
            </div>
        `;

        card.onclick = () => {

            document.getElementById(
                'currentTitle'
            ).textContent =
            video.title;

            document.getElementById(
                'player'
            ).src =
            video.url;
        };

        container.appendChild(card);

    });

    const btn =
    document.createElement('button');

    btn.className = 'button';

    btn.style.marginTop = '10px';

    btn.textContent =
    '➕ Tilføj video';

    btn.onclick = addVideo;

    container.appendChild(btn);

}

function addCategory(){

    const name =
    prompt('Kategori navn');

    if(!name) return;

    if(!library[name]){

        library[name] = [];

        saveLibrary();

        renderCategories();

    }
}

function addVideo(){

    const title =
    prompt('Video titel');

    if(!title) return;

    const youtubeUrl =
    prompt('Indsæt YouTube link');

    if(!youtubeUrl) return;

    let id = '';

    if(youtubeUrl.includes('watch?v=')){

        id =
        youtubeUrl
        .split('v=')[1]
        .split('&')[0];

    }
    else if(
        youtubeUrl.includes('youtu.be/')
    ){

        id =
        youtubeUrl
        .split('youtu.be/')[1]
        .split('?')[0];

    }
    else if(
        youtubeUrl.includes('/embed/')
    ){

        id =
        youtubeUrl
        .split('/embed/')[1];

    }

    if(!id){

        alert(
        'Kun YouTube links understøttes'
        );

        return;
    }

    library[currentCategory].push({

        title: title,

        youtubeId: id,

        url:
        'https://www.youtube.com/embed/' +
        id

    });

    saveLibrary();

    renderVideos();

}

renderCategories();
renderVideos();

</script>

</body>
</html>
